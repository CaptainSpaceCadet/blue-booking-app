services:
  web:
    build: .
    container_name: blue_booking_web
    command: >
      sh -c "
        echo '⏳ Waiting for PostgreSQL...' &&
        sleep 15 &&
        echo '📦 Running migrations...' &&
        python manage.py migrate --noinput &&
        echo '📁 Collecting static files...' &&
        python manage.py collectstatic --noinput &&
        echo '🚀 Starting Uvicorn...' &&
        uvicorn blue_booking_app.asgi:application --host 0.0.0.0 --port 8000 --workers 4
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=*,localhost,127.0.0.1,0.0.0.0,web,192.168.65.1
      - SECRET_KEY=your-super-secret-production-key
      - POSTGRES_USER=blue_booking_user
      - POSTGRES_PASSWORD=blue_booking_pass_123
      - POSTGRES_DB=blue_booking_db
      - DATABASE_URL=postgresql://blue_booking_user:blue_booking_pass_123@db:5432/blue_booking_db
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "8000:8000"  # For direct access

  nginx:
    image: nginx:alpine
    container_name: blue_booking_nginx
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: blue_booking_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=blue_booking_user
      - POSTGRES_PASSWORD=blue_booking_pass_123
      - POSTGRES_DB=blue_booking_db
      - POSTGRES_INITDB_ARGS=--locale=C  # Fix locale warning
    ports:
      - "5432:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: blue_booking_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  static_volume:
  media_volume:
  postgres_data:
  pgadmin_data: